services:
  canopuscare:
    build: .
    env_file:
      - .env
    ports:
      - "5173:5173"
    environment:
      APP_MODE: demo
      NODE_ENV: production
      POST_LIVE: "0"
      PORT: "5173"
      APP_BASE_URL: http://localhost:5173
      DATABASE_PATH: /app/data/canopus-care-demo.db
      ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - canopus_data:/app/data
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  canopus_data:
