name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm run test
      - name: Demo database build
        run: npm run db:seed
        env:
          APP_MODE: demo
          POST_LIVE: "0"
      - name: Hermetic server and smoke tests
        run: npm run smoke:hermetic
      - name: Secret-pattern scan
        run: |
          ! grep -RInE "(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z_]{20,})" . --exclude-dir=.git --exclude-dir=node_modules
      - name: Docker build
        run: docker build -t canopuscare-demo .
