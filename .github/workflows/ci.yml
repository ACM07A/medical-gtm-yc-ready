name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm run test
      - name: Demo database build
        run: npm run db:seed
        env:
          APP_MODE: demo
          POST_LIVE: "0"
      - name: Start server
        run: |
          node --experimental-sqlite server/server.mjs > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do curl -fsS http://localhost:5173/api/readiness && exit 0; sleep 1; done
          cat server.log
          exit 1
        env:
          APP_MODE: demo
          POST_LIVE: "0"
      - name: Smoke tests
        run: npm run smoke
      - name: Secret-pattern scan
        run: |
          ! grep -RInE "(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z_]{20,})" . --exclude-dir=.git --exclude-dir=node_modules
      - name: Docker build
        run: docker build -t medyatra-demo .
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
